<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
</head>
<link rel="stylesheet" href="style.css">
<body>

<div class="container">

    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter Your Task" onkeypress="enterTask(event)">
    <button onclick="addTask()">Add Task</button>

    <p id="message"></p>

    <ul id="list">
        <li>No Tasks Available</li>
    </ul>

    <h3>Total Tasks : <span id="ttask">0</span></h3>
    <h3>Completed Tasks : <span id="ctask">0</span></h3>
    <h3>Pending Tasks : <span id="ptask">0</span></h3>

</div>

<script src="script.js"></script>
</body>
</html>
